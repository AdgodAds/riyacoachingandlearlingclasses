<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    min-height:100%;
}

body{

    min-height:100vh;

    overflow-x:hidden;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color:#e6efff;

    background:

        radial-gradient(
            circle at 50% 12%,
            rgba(30,110,200,.24),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 70%,
            rgba(40,70,170,.14),
            transparent 40%
        ),

        linear-gradient(
            180deg,
            #05091b 0%,
            #0a122b 50%,
            #05091a 100%
        );
}


/* BACKGROUND GRID */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.30;

    background-image:

        linear-gradient(
            rgba(75,120,190,.14) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(75,120,190,.14) 1px,
            transparent 1px
        );

    background-size:72px 72px;
}


/* PAGE */

.page{

    width:100%;

    min-height:100vh;

    padding:
        100px 20px 30px;

    display:flex;

    justify-content:center;

    align-items:center;
}


/* CARD */

.card{

    position:relative;

    width:100%;

    max-width:680px;

    padding:
        78px 48px 54px;

    border-radius:58px;

    border:
        1px solid
        rgba(99,92,220,.48);

    background:

        radial-gradient(
            circle at 50% 12%,
            rgba(30,112,190,.18),
            transparent 29%
        ),

        linear-gradient(
            145deg,
            rgba(22,36,83,.97),
            rgba(16,28,71,.98)
        );

    box-shadow:

        inset
        0 0 0 1px
        rgba(30,92,180,.10),

        0 30px 80px
        rgba(0,0,0,.45),

        0 0 65px
        rgba(40,80,210,.14);

    overflow:hidden;
}


/* LOGO */

.logo-wrap{

    position:relative;

    width:252px;
    height:252px;

    margin:
        0 auto 55px;

    border-radius:54px;

    background:#fff;

    display:flex;

    justify-content:center;

    align-items:center;

    box-shadow:

        0 0 0 1px
        rgba(99,203,255,.55),

        0 0 35px
        rgba(37,177,255,.36),

        0 0 75px
        rgba(37,124,255,.15);

    overflow:hidden;
}


/* CLOUDINARY LOGO */

.logo-wrap img{

    position:relative;

    z-index:2;

    display:block;

    width:100%;

    height:100%;

    object-fit:cover;

    border-radius:54px;

}


/* LOGO OUTER RING */

.logo-wrap::after{

    content:"";

    position:absolute;

    width:284px;

    height:284px;

    border-radius:50%;

    border:
        1px solid
        rgba(45,196,255,.38);

    box-shadow:
        0 0 25px
        rgba(40,171,255,.12);
}


/* TITLE */

h1{

    text-align:center;

    font-size:49px;

    line-height:1.08;

    letter-spacing:7px;

    font-weight:700;

    white-space:nowrap;

    color:#38a9ff;

    text-shadow:
        0 0 18px
        rgba(47,164,255,.25);
}


/* TAGLINE */

.tagline{

    margin-top:24px;

    text-align:center;

    font-family:Arial,sans-serif;

    font-size:18px;

    letter-spacing:6px;

    color:#76729d;
}


/* DIVIDER */

.divider{

    display:flex;

    align-items:center;

    gap:25px;

    margin:
        58px 0 50px;
}

.divider::before,
.divider::after{

    content:"";

    height:1px;

    flex:1;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(92,79,197,.48)
        );
}

.divider::after{

    background:
        linear-gradient(
            90deg,
            rgba(92,79,197,.48),
            transparent
        );
}


.diamond{

    width:10px;

    height:10px;

    transform:rotate(45deg);

    background:#6944c5;

    box-shadow:
        0 0 14px
        rgba(115,74,255,.7);
}


/* STATS */

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;
}


.stat{

    min-height:162px;

    border-radius:28px;

    border:
        1px solid
        rgba(78,85,174,.38);

    background:

        linear-gradient(
            145deg,
            rgba(29,42,91,.72),
            rgba(22,34,79,.74)
        );

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}


.stat strong{

    font-size:34px;

    font-weight:500;

    color:#e2edff;
}


.stat span{

    margin-top:24px;

    font-family:Arial,sans-serif;

    font-size:15px;

    letter-spacing:3px;

    color:#747796;
}


/* DOWNLOAD BUTTON */

.download{

    width:100%;

    height:108px;

    margin-top:62px;

    border-radius:32px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

        linear-gradient(
            135deg,
            #20a6df,
            #2fbbf0
        );

    color:#fff;

    text-decoration:none;

    font-family:Arial,sans-serif;

    font-size:26px;

    font-weight:700;

    letter-spacing:1px;

    box-shadow:

        0 17px 34px
        rgba(22,143,220,.27),

        0 0 30px
        rgba(35,170,245,.15);

    transition:
        transform .18s ease,
        filter .18s ease;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}


.download:hover{

    transform:translateY(-2px);

    filter:brightness(1.06);
}


.download:active{

    transform:scale(.985);
}


.download.loading{

    opacity:.88;

    pointer-events:none;
}


.arrow{

    margin-right:15px;

    font-size:34px;
}


/* FOOTER */

.footer{

    margin-top:52px;

    text-align:center;

    font-family:Arial,sans-serif;

    font-size:15px;

    letter-spacing:3px;

    color:#555978;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .page{

        padding:
            80px 15px 25px;
    }


    .card{

        padding:
            65px 22px 40px;

        border-radius:44px;
    }


    .logo-wrap{

        width:220px;

        height:220px;

        margin-bottom:45px;
    }


    .logo-wrap::after{

        width:248px;

        height:248px;
    }


    h1{

        font-size:32px;

        letter-spacing:4px;

        white-space:normal;
    }


    .tagline{

        font-size:12px;

        letter-spacing:4px;
    }


    .divider{

        margin:
            45px 0 35px;
    }


    .stats{

        gap:8px;
    }


    .stat{

        min-height:130px;

        border-radius:22px;
    }


    .stat strong{

        font-size:24px;
    }


    .stat span{

        margin-top:16px;

        font-size:10px;

        letter-spacing:1.5px;
    }


    .download{

        height:88px;

        margin-top:42px;

        border-radius:27px;

        font-size:20px;
    }


    .arrow{

        font-size:29px;
    }


    .footer{

        margin-top:38px;

        font-size:11px;
    }

}


/* EXTRA SMALL */

@media(max-width:390px){

    .card{

        padding-left:16px;

        padding-right:16px;
    }


    .logo-wrap{

        width:200px;

        height:200px;
    }


    .logo-wrap::after{

        width:226px;

        height:226px;
    }


    h1{

        font-size:27px;
    }


    .stats{

        gap:6px;
    }


    .stat{

        min-height:120px;
    }


    .stat strong{

        font-size:21px;
    }

}

</style>

<script>

(function(){

    const downloadBtn =
        document.getElementById('downloadBtn');


    if(!downloadBtn){
        return;
    }


    downloadBtn.addEventListener(
        'click',
        function(event){

            event.preventDefault();


            const downloadURL =
                this.href;


            /*
             * CUSTOM DOWNLOAD EVENT
             */

            if(typeof fbq === 'function'){

                fbq(
                    'trackCustom',
                    'Download',
                    {
                        content_name:
                            'Application Download',

                        content_type:
                            'application',

                        content_url:
                            downloadURL
                    }
                );


                /*
                 * LEAD EVENT
                 */

                fbq(
                    'track',
                    'Lead',
                    {
                        content_name:
                            'Application Download',

                        content_category:
                            'App Download'
                    }
                );

            }


            /*
             * BUTTON FEEDBACK
             */

            downloadBtn.classList.add('loading');

            downloadBtn.innerHTML =
                '<span class="arrow">✓</span> Starting Download...';


            /*
             * Give Pixel time to send event
             */

            setTimeout(
                function(){

                    window.location.href =
                        downloadURL;

                },
                500
            );

        }
    );

})();
